name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed SemVer tag to (re)publish
        required: true

permissions:
  contents: read

env:
  TOOL_RUNTIMES: linux-x64;linux-arm64;osx-arm64;win-x64;win-arm64;any

jobs:
  build:
    if: github.repository == 'AHRConsulting/Ahr.Assurance'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Resolve and check the version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a v-prefixed SemVer tag: $tag" >&2; exit 1; }
          [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]] || { echo "The checkout isn't the tagged commit." >&2; exit 1; }
          version="${tag#v}"
          declared="$(sed -n 's:.*<AhrAssuranceVersion [^>]*>\(.*\)</AhrAssuranceVersion>.*:\1:p' Directory.Build.props)"
          [[ "$declared" == "$version" ]] || { echo "Directory.Build.props says $declared, the tag says $version." >&2; exit 1; }
          grep -q "^## $version$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: dotnet restore Ahr.Assurance.slnx --locked-mode
      - run: dotnet format Ahr.Assurance.slnx --verify-no-changes --severity warn --no-restore
      - run: dotnet build Ahr.Assurance.slnx -c Release --no-restore
      - run: dotnet test --solution Ahr.Assurance.slnx -c Release --no-build --report-trx --results-directory artifacts/test-results
      - run: dotnet vstest tests/adapters/xunit/Ahr.Assurance.Xunit.v2.Tests/bin/Release/net10.0/Ahr.Assurance.Xunit.v2.Tests.dll --logger "trx;LogFileName=Ahr.Assurance.Xunit.v2.Tests.trx" --ResultsDirectory:artifacts/test-results
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: .NET Test Results (release)
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true
      - name: Install Chromium for the package check
        run: pwsh tests/adapters/playwright/Ahr.Assurance.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Verify the packages from a consumer
        run: bash scripts/verify-package.sh
      - name: Pack the libraries and the CLI's pointer and fallback packages
        shell: bash
        run: |
          dotnet pack Ahr.Assurance.slnx -c Release --no-build -o artifacts/packages
          rm -f artifacts/packages/Ahr.Assurance.Cli.*
          dotnet pack src/Ahr.Assurance.Cli -c Release -o artifacts/packages "-p:ToolPackageRuntimeIdentifiers=\"$TOOL_RUNTIMES\""
          dotnet pack src/Ahr.Assurance.Cli -c Release -r any -p:PublishAot=false -o artifacts/packages "-p:ToolPackageRuntimeIdentifiers=\"$TOOL_RUNTIMES\""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-libraries
          path: artifacts/packages/*
          if-no-files-found: error

  native:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish and run the native CLI
        shell: bash
        run: |
          dotnet publish src/Ahr.Assurance.Cli -c Release -r ${{ matrix.rid }} -o artifacts/native -warnaserror
          ./artifacts/native/Ahr.Assurance.Cli --version
      - name: Pack the native CLI
        shell: bash
        run: dotnet pack src/Ahr.Assurance.Cli -c Release -r ${{ matrix.rid }} -o artifacts/packages "-p:ToolPackageRuntimeIdentifiers=\"$TOOL_RUNTIMES\""
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages/Ahr.Assurance.Cli.${{ matrix.rid }}.*
          if-no-files-found: error

  publish:
    needs: [build, native]
    if: github.repository == 'AHRConsulting/Ahr.Assurance'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts/packages
          merge-multiple: true
      - name: Check whether this version is already published
        id: nuget-check
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://api.nuget.org/v3-flatcontainer/ahr.assurance/$VERSION/ahr.assurance.$VERSION.nupkg")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected NuGet.org response status: $status" >&2; exit 1 ;;
          esac
      - name: Record package hashes
        working-directory: artifacts/packages
        run: sha256sum *.nupkg > SHA256SUMS
      - name: Request a temporary NuGet.org API key
        if: steps.nuget-check.outputs.published != 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages to NuGet.org
        if: steps.nuget-check.outputs.published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/packages/* --repo "${{ github.repository }}" --clobber
          elif [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" artifacts/packages/* --repo "${{ github.repository }}" --generate-notes --prerelease
          else
            gh release create "$tag" artifacts/packages/* --repo "${{ github.repository }}" --generate-notes --latest
          fi
