name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      all-systems:
        description: Also run on Windows and macOS
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: write

env:
  TUNIT_DISABLE_GITHUB_REPORTER: "true"
  TUNIT_DISABLE_HTML_REPORTER: "true"

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all-systems && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Ahr.Assurance.slnx --locked-mode
      - run: dotnet format Ahr.Assurance.slnx --verify-no-changes --severity warn --no-restore
        if: matrix.os == 'ubuntu-24.04'
      - run: dotnet build Ahr.Assurance.slnx -c Release --no-restore
      - name: Install Chromium for Playwright tests
        run: pwsh tests/adapters/playwright/Ahr.Assurance.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run tests
        run: dotnet test --solution Ahr.Assurance.slnx -c Release --no-build --report-trx --results-directory artifacts/test-results
        env:
          ASSURANCE_RUN_ID: ci-${{ github.run_id }}
      - name: Name the MSTest 3 test results
        if: always()
        shell: bash
        run: for file in artifacts/test-results/_*.trx; do [ -f "$file" ] && mv "$file" artifacts/test-results/Ahr.Assurance.MSTest.v3.Tests.trx; done; true
      # The xUnit v2 tests, on VSTest.
      - name: Run xUnit v2 tests
        run: dotnet vstest tests/adapters/xunit/Ahr.Assurance.Xunit.v2.Tests/bin/Release/net10.0/Ahr.Assurance.Xunit.v2.Tests.dll samples/Ahr.Assurance.Sample.Xunit.v2/bin/Release/net10.0/Ahr.Assurance.Sample.Xunit.v2.dll --logger "trx;LogFileName=Ahr.Assurance.Xunit.v2.Tests.trx" --ResultsDirectory:artifacts/test-results
        env:
          ASSURANCE_RUN_ID: ci-${{ github.run_id }}
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: .NET Test Results (${{ matrix.os }})
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true
      # The report of this repository's own tests, built by the CLI from this commit.
      - name: Build the Assurance report
        if: always()
        run: dotnet run --project src/Ahr.Assurance.Cli -c Release --no-build -- report Ahr.Assurance.slnx --run ci-${{ github.run_id }} --exclude-project Ahr.Assurance.Sample.Xunit.v3 --exclude-project Ahr.Assurance.Sample.Xunit.v2 --exclude-project Ahr.Assurance.Sample.MSTest.v3 --exclude-project Ahr.Assurance.Sample.NUnit --exclude-project Ahr.Assurance.Sample.MSTest --exclude-project Ahr.Assurance.Sample.TUnit --exclude-project Ahr.Assurance.Sample.Playwright --title "Ahr.Assurance ${{ github.sha }}"
      - name: Upload the Assurance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-report-${{ matrix.os }}
          path: artifacts/assurance/report/
          if-no-files-found: warn
      - name: Write the report headline to the job summary
        if: always() && matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          report=artifacts/assurance/report/report.html
          [ -f "$report" ] || exit 0
          headline="$(grep -o '<p class="headline">[^<]*' "$report" | head -1 | sed 's/.*>//' || true)"
          tests="$(grep -o '[0-9]* tests\? ran: [^<]*' "$report" | head -1 || true)"
          {
            printf '### Assurance report\n\n%s\n\n' "$headline"
            if [ -n "$tests" ]; then printf '%s\n\n' "$tests"; fi
            printf 'Download the `assurance-report-%s` artifact for the full report.\n' "${{ matrix.os }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
      - name: Verify the packages from a consumer
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/verify-package.sh

  benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet run -c Release --project benchmarks/Ahr.Assurance.Benchmarks -- --filter '*' --job short --exporters json --artifacts benchmark-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results/results/
